<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled document - Google Docs Style</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <path fill="#4285F4" d="M24 4H10c-2.2 0-4 1.8-4 4v24c0 2.2 1.8 4 4 4h20c2.2 0 4-1.8 4-4V14l-10-10z"/>
                    <path fill="#A1C2FA" d="M24 4v6c0 2.2 1.8 4 4 4h6L24 4z"/>
                    <path fill="#FFF" d="M12 20h16v2H12v-2zm0 4h16v2H12v-2zm0 4h12v2H12v-2z"/>
                </svg>
            </div>
            <div class="document-info">
                <div class="document-title-container">
                    <input type="text" class="document-title" value="Untitled document" id="docTitle">
                    <svg class="star-icon" width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#5F6368" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                    </svg>
                </div>
                <div class="menu-bar">
                    <button class="menu-item">File</button>
                    <button class="menu-item">Edit</button>
                    <button class="menu-item">View</button>
                    <button class="menu-item">Insert</button>
                    <button class="menu-item">Format</button>
                    <button class="menu-item">Tools</button>
                    <button class="menu-item">Extensions</button>
                    <button class="menu-item">Help</button>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button class="icon-button" id="darkModeToggle" title="Toggle dark mode">
                <svg width="24" height="24" viewBox="0 0 24 24" id="darkModeIcon">
                    <path fill="#5F6368" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
            </button>
            <button class="icon-button">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <path fill="#5F6368" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
            </button>
            <button class="icon-button">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <path fill="#5F6368" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
            </button>
            <button class="share-button">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#FFF" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
                </svg>
                Share
            </button>
            <div class="profile-icon">
                <svg width="32" height="32" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" fill="#1A73E8"/>
                    <text x="12" y="16" text-anchor="middle" fill="white" font-size="12" font-family="Roboto">U</text>
                </svg>
            </div>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-section">
            <button class="toolbar-button" title="Undo">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
                </svg>
            </button>
            <button class="toolbar-button" title="Redo">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
                </svg>
            </button>
            <button class="toolbar-button" title="Print">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
                </svg>
            </button>
            <button class="toolbar-button" title="Spelling and grammar">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M12.45 16h2.09L9.43 3H7.57L2.46 16h2.09l1.12-3h5.64l1.14 3zm-6.02-5L8.5 5.48 10.57 11H6.43zm15.16.59l-8.09 8.09L9.83 16l-1.41 1.41 5.09 5.09L23 13l-1.41-1.41z"/>
                </svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-section">
            <select class="toolbar-select heading-select" id="headingSelect">
                <option value="">Normal text</option>
                <option value="h1">Heading 1</option>
                <option value="h2">Heading 2</option>
                <option value="h3">Heading 3</option>
                <option value="h4">Heading 4</option>
                <option value="h5">Heading 5</option>
                <option value="h6">Heading 6</option>
            </select>
            <select class="toolbar-select font-select">
                <option>Arial</option>
                <option>Calibri</option>
                <option>Comic Sans MS</option>
                <option>Georgia</option>
                <option>Roboto</option>
                <option>Times New Roman</option>
                <option>Verdana</option>
            </select>
            <select class="toolbar-select size-select">
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option selected>11</option>
                <option>12</option>
                <option>14</option>
                <option>18</option>
                <option>24</option>
                <option>30</option>
                <option>36</option>
            </select>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-section">
            <button class="toolbar-button toggle-button" data-command="bold" title="Bold (Ctrl+B)">
                <strong>B</strong>
            </button>
            <button class="toolbar-button toggle-button" data-command="italic" title="Italic (Ctrl+I)">
                <em>I</em>
            </button>
            <button class="toolbar-button toggle-button" data-command="underline" title="Underline (Ctrl+U)">
                <u>U</u>
            </button>
            <button class="toolbar-button" id="textColorBtn" title="Text color">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M9.93 13.5h4.14L12 7.98zM20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-4.05 16.5l-1.14-3H9.17l-1.12 3H5.96l5.11-13h1.86l5.11 13h-2.09z"/>
                    <rect y="18" width="24" height="6" fill="#000" id="textColorIndicator"/>
                </svg>
                <input type="color" id="textColorPicker" style="display: none;" value="#000000">
            </button>
            <button class="toolbar-button" id="highlightColorBtn" title="Highlight color">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M17.75 7L14 3.25l-10 10V17h3.75l10-10zm2.96-2.96c.39-.39.39-1.02 0-1.41L18.37.29c-.39-.39-1.02-.39-1.41 0L15 2.25 18.75 6l1.96-1.96z"/>
                    <rect y="18" width="24" height="6" fill="#FFEB3B" id="highlightColorIndicator"/>
                </svg>
                <input type="color" id="highlightColorPicker" style="display: none;" value="#FFEB3B">
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-section">
            <button class="toolbar-button" title="Insert link">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
                </svg>
            </button>
            <button class="toolbar-button" title="Insert comment">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
                </svg>
            </button>
            <button class="toolbar-button" title="Insert image">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                </svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-section">
            <button class="toolbar-button" data-command="justifyLeft" title="Align left">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/>
                </svg>
            </button>
            <button class="toolbar-button" data-command="justifyCenter" title="Align center">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M7 15v2h10v-2H7zm-4 6h18v-2H3v2zm0-8h18v-2H3v2zm4-6v2h10V7H7zM3 3v2h18V3H3z"/>
                </svg>
            </button>
            <button class="toolbar-button" data-command="justifyRight" title="Align right">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zM3 3v2h18V3H3z"/>
                </svg>
            </button>
            <button class="toolbar-button" data-command="justifyFull" title="Justify">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M3 21h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18v-2H3v2zm0-4h18V7H3v2zm0-6v2h18V3H3z"/>
                </svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-section">
            <button class="toolbar-button" id="indentBtn" title="Increase indent">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M3 21h18v-2H3v2zM3 8v8l4-4-4-4zm8 9h10v-2H11v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/>
                </svg>
            </button>
            <button class="toolbar-button" id="outdentBtn" title="Decrease indent">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M11 17h10v-2H11v2zm-8-5l4 4V8l-4 4zm0 9h18v-2H3v2zM3 3v2h18V3H3zm8 6h10V7H11v2zm0 4h10v-2H11v2z"/>
                </svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-section">
            <button class="toolbar-button" id="lineSpacingBtn" title="Line spacing">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M6 7h2.5L5 3.5 1.5 7H4v10H1.5L5 20.5 8.5 17H6V7zm4-2v2h12V5H10zm0 14h12v-2H10v2zm0-6h12v-2H10v2z"/>
                </svg>
            </button>
            <button class="toolbar-button" title="Checklist">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M22 7h-9v2h9V7zm0 8h-9v2h9v-2zM5.54 11L2 7.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 11zm0 8L2 15.46l1.41-1.41 2.12 2.12 4.24-4.24 1.41 1.41L5.54 19z"/>
                </svg>
            </button>
            <button class="toolbar-button" data-command="insertUnorderedList" title="Bulleted list">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/>
                </svg>
            </button>
            <button class="toolbar-button" data-command="insertOrderedList" title="Numbered list">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/>
                </svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-section">
            <button class="toolbar-button" id="insertTableBtn" title="Insert table">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M10 10.02h5V21h-5zM17 21h3c1.1 0 2-.9 2-2v-9h-5v11zm3-18H5c-1.1 0-2 .9-2 2v3h19V5c0-1.1-.9-2-2-2zM3 19c0 1.1.9 2 2 2h3V10.02H3V19z"/>
                </svg>
            </button>
            <button class="toolbar-button" title="More options">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#444746" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Document Container -->
    <div class="document-container">
        <div class="page" id="editor" contenteditable="true" spellcheck="true" role="textbox" aria-label="Document editor" aria-multiline="true">
            <p>Start typing your document here...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
